# Production server for the static Sunspark Rumble site (dist/ from `npm run build:web`).
# Installed as /etc/nginx/conf.d/default.conf, so this file lives inside nginx's http{} block.

# Images and the favicon cache for a day; everything else revalidates through its ETag.
# $sent_http_content_type is read at header time, so one server-level add_header covers every response.
map $sent_http_content_type $sunspark_cache_control {
    default "no-cache";
    ~^image/ "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    # text/html is always charset-tagged and cannot be listed again.
    charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # Serve the precompressed .gz siblings written by build-web.mjs; compress on the fly only when one is missing.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # add_header is inherited only while a block defines none of its own, so keep every header here and
    # do not add location blocks that call add_header. Unknown paths fall through to nginx's default 404.
    add_header Cache-Control $sunspark_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
